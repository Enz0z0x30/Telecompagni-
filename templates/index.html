<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Télécompagnie - Moteur de recherche</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        .header { margin: 30px 0 20px 0; text-align: center; }
        .header h1 { font-size: 2.2rem; color: #38bdf8; }
        .search-box { width: 100%; max-width: 650px; display: flex; gap: 10px; margin-bottom: 25px; }
        input[type="text"] { flex: 1; padding: 14px 18px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 1rem; outline: none; }
        button { padding: 14px 22px; border-radius: 10px; border: none; background: #0284c7; color: white; font-weight: bold; cursor: pointer; }
        .container { width: 100%; max-width: 650px; }
        
        /* Pavé Knowledge Graph */
        .knowledge-card { background: #1e293b; border: 1px solid #38bdf8; border-radius: 12px; padding: 20px; margin-bottom: 25px; display: flex; gap: 15px; }
        .knowledge-card img { width: 90px; height: 90px; object-fit: cover; border-radius: 8px; }
        .knowledge-content h2 { font-size: 1.3rem; color: #38bdf8; margin-bottom: 4px; }
        .knowledge-content .subtitle { font-size: 0.85rem; color: #94a3b8; font-style: italic; margin-bottom: 8px; }
        .knowledge-content p { font-size: 0.95rem; line-height: 1.4; color: #e2e8f0; }
        
        .results { list-style: none; }
        .result-item { background: #1e293b; padding: 16px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #334155; }
        .result-item a { color: #38bdf8; text-decoration: none; font-size: 1.1rem; font-weight: bold; }
        .result-item p { color: #94a3b8; font-size: 0.95rem; margin-top: 6px; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Télécompagnie</h1>
    </div>
    <form class="search-box" action="/" method="GET">
        <input type="text" name="q" value="{{ query }}" placeholder="Ex: Paris, Albert Einstein, France..." required>
        <button type="submit">Chercher</button>
    </form>
    
    <div class="container">
        {% if card %}
        <div class="knowledge-card">
            {% if card.thumbnail %}
            <img src="{{ card.thumbnail }}" alt="{{ card.title }}">
            {% endif %}
            <div class="knowledge-content">
                <h2>{{ card.title }}</h2>
                {% if card.description %}<div class="subtitle">{{ card.description }}</div>{% endif %}
                <p>{{ card.extract }}</p>
            </div>
        </div>
        {% endif %}

        <ul class="results">
            {% for r in results %}
            <li class="result-item">
                <a href="{{ r.link }}" target="_blank">{{ r.title }}</a>
                <p>{{ r.snippet }}</p>
            </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
